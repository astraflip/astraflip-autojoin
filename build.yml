name: Build

# Builds the Windows app on GitHub's own machines, straight from the code in this repo,
# and attaches a signed build attestation so anyone can check the .exe came from this code.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install build tools
        run: python -m pip install --upgrade pyinstaller playwright

      - name: Build AstraFlip AutoJoin.exe
        run: python -m PyInstaller --noconfirm --onefile --noconsole --icon icon.ico --name "AstraFlip AutoJoin" --collect-all playwright autojoin_app.py

      - name: SHA-256 fingerprint
        shell: pwsh
        run: |
          $h = (Get-FileHash "dist/AstraFlip AutoJoin.exe" -Algorithm SHA256).Hash.ToLower()
          "$h  AstraFlip AutoJoin.exe" | Out-File -Encoding ascii dist/SHA256.txt
          Get-Content dist/SHA256.txt

      - name: Build attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: "dist/AstraFlip AutoJoin.exe"

      - uses: actions/upload-artifact@v4
        with:
          name: AstraFlip-AutoJoin
          path: |
            dist/AstraFlip AutoJoin.exe
            dist/SHA256.txt

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/AstraFlip AutoJoin.exe
            dist/SHA256.txt
